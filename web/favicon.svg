<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="netrouting">
  <title>netrouting</title>
  <!-- antennas (sky blue, the structure color) -->
  <line x1="10" y1="5" x2="10" y2="13" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="5" x2="22" y2="13" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="10" cy="5" r="2" fill="#0369a1"/>
  <circle cx="22" cy="5" r="2" fill="#0369a1"/>
  <!-- router body -->
  <rect x="4" y="13" width="24" height="14" rx="3"
        fill="#0369a1" fill-opacity="0.10"
        stroke="#0369a1" stroke-width="3" stroke-linejoin="round"/>
  <!-- LEDs (amber accent — the "signal" color) -->
  <circle cx="10" cy="20" r="2" fill="#ea580c"/>
  <circle cx="16" cy="20" r="2" fill="#ea580c"/>
  <circle cx="22" cy="20" r="2" fill="#ea580c"/>
</svg>
