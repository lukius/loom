    <circle cx="23" cy="23" r="1" fill="currentColor"/>
  </symbol>

  <!-- Host: workstation / monitor with stand -->

    <!-- monitor frame -->
    <rect x="2.5" y="3.5" width="23" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- inner screen -->

    <!-- horizontal "lines" of text on screen -->

    <line x1="6.5" y1="11.5" x2="19" y2="11.5" stroke="currentColor" stroke-width="1" opacity="0.40"/>
    <line x1="6.5" y1="14"  x2="11"  y2="14"  stroke="currentColor" stroke-width="1" opacity="0.55"/>
    <!-- stand -->

    <line x1="8"  y1="26.8" x2="20" y2="26.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11" y1="24"   x2="17" y2="24"   stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- Router: stylized 3D cube with two antennae and ethernet ports -->

    <path d="M3 13 L3 21 L16 26 L16 18 Z" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M29 13 L29 21 L16 26 L16 18 Z" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- ports -->

    </div>

    <div class="head-mid">

        </button>

<script>
/* ===========================================================
   netrouting — interactive topology canvas
   =========================================================== */
const STORAGE_KEY = 'netrouting.topology.v4';
const THEME_KEY = 'netrouting.theme';

const state = {
  asName: 'test_as',
  /* networks[name] = { cidr, x, y } */
  networks: {},
  /* hosts[name] = { network, address, x, y } */
  hosts: {},
  /* routers[name] = { interfaces: { ifn: { network, address, cost } }, x, y } */
  routers: {},
  selection: null,        // { kind, name }
  view: { x: 0, y: 0, k: 1 }, // pan x,y and zoom factor
};

/* node sizes — w/h represent the icon (or cloud) bounding box centered at obj.x/obj.y;
   labels render below this box and are included in a wider hit area at draw time */
const NODE = {
  network: { w: 220, h: 84 },   // cloud silhouette
  host:    { w: 56,  h: 60 },   // workstation icon
  router:  { w: 64,  h: 64 },   // router cube
};
const HIT_PAD = { network: { x: 12, top: 10, bottom: 32 }, host: { x: 18, top: 6, bottom: 36 }, router: { x: 18, top: 6, bottom: 38 } };

const SAMPLE = {
  asName: 'test_as',
  networks: {
    lan1: { cidr: '200.100.0.0/24', x: 460, y: 160 },
    lan2: { cidr: '100.200.0.0/24', x: 460, y: 360 },
    lan3: { cidr: '150.10.10.0/24', x: 460, y: 560 },
  },
  hosts: {
    h1: { network: 'lan1', address: '200.100.0.10', x: 230, y: 160 },
    h2: { network: 'lan2', address: '100.200.0.20', x: 230, y: 360 },
    h3: { network: 'lan3', address: '150.10.10.30', x: 230, y: 560 },
  },
  routers: {
    r1: { x: 720, y: 250, interfaces: {
      eth0: { network: 'lan1', address: '200.100.0.1',   cost: 10 },
      eth1: { network: 'lan2', address: '100.200.0.1',   cost: 15 },
    }},
    r2: { x: 820, y: 360, interfaces: {
      eth0: { network: 'lan1', address: '200.100.0.254', cost: 5 },
      eth1: { network: 'lan2', address: '100.200.0.2',   cost: 8 },
      eth2: { network: 'lan3', address: '150.10.10.1',   cost: 15 },
    }},
    r3: { x: 720, y: 460, interfaces: {
      eth0: { network: 'lan2', address: '100.200.0.10', cost: 20 },
      eth1: { network: 'lan3', address: '150.10.10.10', cost: 5 },
    }},
  },
};

/* ---------- RuntimeClient — REST + WS wrapper ---------- */
const RuntimeClient = {
  baseURL: '',
  ws: null,
  _wsBackoff: 500,
  _onEvent: null,

  async _json(method, path, body) {
    const r = await fetch(this.baseURL + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.statusText);
    return j;
  },

  getTopology()          { return this._json('GET',  '/topology'); },
  loadTopology(yaml)     { return this._json('POST', '/topology', { yaml }); },
  resetTopology()        { return this._json('POST', '/topology/reset', {}); },
  start()                { return this._json('POST', '/sim/start', {}); },
  pause()                { return this._json('POST', '/sim/pause', {}); },
  resume(patch)          { return this._json('POST', '/sim/resume', { patch: patch || [] }); },
  stop()                 { return this._json('POST', '/sim/stop', {}); },
  getState()             { return this._json('GET',  '/sim/state'); },
  setRefreshInterval(s)  { return this._json('POST', '/sim/refresh_interval', { seconds: s }); },
  deviceCommand(n, cmd)  { return this._json('POST', `/devices/${encodeURIComponent(n)}/command`, { cmd }); },
  deviceRoutes(n)        { return this._json('GET',  `/devices/${encodeURIComponent(n)}/routes`); },
  deviceInterfaces(n)    { return this._json('GET',  `/devices/${encodeURIComponent(n)}/interfaces`); },

  connectEvents(onEvent) {
    this._onEvent = onEvent;
    this._openWs();
  },
  _openWs() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    this.ws = new WebSocket(`${proto}//${location.host}/ws/events`);
    this.ws.onmessage = (m) => { try { this._onEvent(JSON.parse(m.data)); } catch (e) {} };
    this.ws.onopen  = () => {
      this._wsBackoff = 500;
      setConnectionStatus(true);
      // The server may have restarted while the socket was down — its sim state
      // can diverge from the SPA's cached state. Re-sync so the toolbar is honest.
      if (typeof Sim !== 'undefined' && Sim.refreshState) {
        Sim.refreshState().catch(() => {});
      }
    };
    this.ws.onclose = () => {
      setConnectionStatus(false);
      setTimeout(() => this._openWs(), this._wsBackoff);
      this._wsBackoff = Math.min(this._wsBackoff * 2, 8000);
    };
  },
  disconnectEvents() {
    if (this.ws) { this.ws.onclose = null; this.ws.close(); this.ws = null; }
  },
};

function setConnectionStatus(connected) {
  let b = document.getElementById('conn-banner');
  if (!b) {
    b = document.createElement('div');
    b.id = 'conn-banner';
    b.className = 'conn-banner';
    document.body.appendChild(b);
  }
  b.textContent = connected ? '' : 'connection lost — retrying';
  b.style.display = connected ? 'none' : 'block';
}

/* ---------- topology lock + patch accumulator ---------- */
function isTopologyLocked() {
  return Sim && Sim.state === 'running';
}

function recordPatchOp(op) {
  if (Sim && Sim.state === 'paused') {
    Sim.patch.push(op);
    updatePatchIndicator();
  }
}

function updatePatchIndicator() {
  const pause = document.getElementById('tb-pause');
  if (!pause) return;
  const lbl = pause.querySelector('.lbl');
  if (Sim.state === 'paused' && Sim.patch.length > 0) {
    lbl.textContent = `Resume (${Sim.patch.length} edits)`;
  } else if (Sim.state === 'paused') {
    lbl.textContent = 'Resume';
  }
}

/* ---------- patch reconciliation ---------- */
function reconcilePatch(patch) {
  const out = [];
  for (const op of patch) {
    if (op.op === 'add_network') {
      const net = state.networks[op.name];
      if (!net) continue;  // dropped before resume
      out.push({ op: 'add_network', name: op.name, address: net.cidr });
    } else if (op.op === 'add_host') {
      const host = state.hosts[op.name];
      if (!host) continue;
      const o = { op: 'add_host', name: op.name, network: host.network, address: host.address };
      if (host.gateway) o.gateway = host.gateway;
      out.push(o);
    } else if (op.op === 'add_router') {
      const router = state.routers[op.name];
      if (!router) continue;
      const ifaces = Object.entries(router.interfaces || {}).map(([iname, iff]) => ({
        name: iname,
        network: iff.network,
        address: iff.address,
        cost: typeof iff.cost === 'number' ? iff.cost : (parseInt(iff.cost, 10) || 1),
      }));
      out.push({ op: 'add_router', name: op.name, interfaces: ifaces });
    } else {
      out.push(op);  // remove_*, update_cost — pass through
    }
  }
  return out;
}

/* ---------- Sim — start/stop/pause/resume state machine ---------- */
const Sim = {
  state: 'idle',
  patch: [],

  async refreshState() {
    const s = await RuntimeClient.getState();
    this.state = s.state;
    this._renderToolbar();
  },

  _renderToolbar() {
    const play = document.getElementById('tb-play');
    const pause = document.getElementById('tb-pause');
    const reset = document.getElementById('tb-reset');
    const playLbl = play.querySelector('.lbl');
    const pauseIcon = pause.querySelector('.ico use');

    if (this.state === 'idle') {
      playLbl.textContent = 'Start'; play.classList.remove('running', 'paused');
      pause.hidden = true;
      reset.disabled = false;
    } else if (this.state === 'running') {
      playLbl.textContent = 'Stop'; play.classList.add('running'); play.classList.remove('paused');
      pause.hidden = false; pause.querySelector('.lbl').textContent = 'Pause';
      pause.setAttribute('title', 'Pause simulation (P)');
      if (pauseIcon) pauseIcon.setAttribute('href', '#ui-pause');
      reset.disabled = true;
    } else if (this.state === 'paused') {
      playLbl.textContent = 'Stop'; play.classList.add('paused'); play.classList.remove('running');
      pause.hidden = false; updatePatchIndicator();
      pause.setAttribute('title', 'Resume simulation (P)');
      if (pauseIcon) pauseIcon.setAttribute('href', '#ui-play');
      reset.disabled = true;
    }
    const lockable = ['tb-add-net', 'tb-add-host', 'tb-add-router'];
    lockable.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = (this.state === 'running');
    });
    const refresh = document.getElementById('tb-refresh');
    if (refresh) refresh.disabled = (this.state === 'idle');
    if (state.selection && (state.selection.kind === 'host' || state.selection.kind === 'router')) {
      Inspector.refreshRoutes(state.selection.name);
    }
    Terminals._applySimState(this.state);
  },

  async onPrimary() {
    try {
      if (this.state === 'idle') {
        const yaml = exportYaml();
        await RuntimeClient.loadTopology(yaml);
        await RuntimeClient.start();
      } else {
        await RuntimeClient.stop();
        this.patch = [];
      }
    } catch (err) {
      toast(err.message || String(err), 'error', this.state === 'idle' ? 'Start' : 'Stop');
    } finally {
      await this.refreshState().catch(() => {});
    }
  },

  async onSecondary() {
    try {
      if (this.state === 'running') await RuntimeClient.pause();
      else if (this.state === 'paused') {
        const resolved = reconcilePatch(this.patch);
        await RuntimeClient.resume(resolved);
        this.patch = [];
        updatePatchIndicator();
      }
    } catch (err) {
      toast(err.message || String(err), 'error', this.state === 'paused' ? 'Resume' : 'Pause');
    } finally {
      await this.refreshState().catch(() => {});
    }
  },

  async onReset() {
    if (this.state !== 'idle') return;
    try {
      await RuntimeClient.resetTopology();
      const { yaml } = await RuntimeClient.getTopology();
      importYaml(yaml);
    } catch (err) {
      toast(err.message || String(err), 'error', 'Reset');
    }
  },
};

/* ---------- PacketAnim ---------- */
const PacketAnim = {
  DURATION_MS: 1800,
  COLORS: {
    routing_flood:  { fill: '#94a3b8', opacity: 0.6 },
    user_datagram:  { fill: '#22c55e', opacity: 1.0 },
    ping_request:   { fill: '#f59e0b', opacity: 1.0 },
    ping_reply:     { fill: '#fbbf24', opacity: 1.0 },
  },
  // Types whose hops should be animated sequentially. Grouped by `flow` (the
  // unordered pair of endpoint addresses) so a ping_request and its ping_reply,
  // which share the same flow, animate one after the other instead of overlapping.
  // Chatter stays parallel so the user still sees the swarm.
  _SEQUENTIAL: new Set(['user_datagram', 'ping_request', 'ping_reply']),
  _lastChatter: new Map(),
  _queues: new Map(),               // flow -> { pending: [evt, ...] }
  muted: false,

  play(evt) {
    if (evt.type === 'routing_flood' && (this.muted || !this._chatterAllowed(evt))) return;

    if (evt.flow && this._SEQUENTIAL.has(evt.type)) {
      const q = this._queues.get(evt.flow);
      if (q) { q.pending.push(evt); return; }
      this._queues.set(evt.flow, { pending: [] });
      this._render(evt, () => this._onSegmentDone(evt.flow));
      return;
    }

    this._render(evt, null);
  },

  _onSegmentDone(flow) {
    const q = this._queues.get(flow);
    if (!q) return;
    if (q.pending.length === 0) {
      this._queues.delete(flow);
      return;
    }
    const next = q.pending.shift();
    this._render(next, () => this._onSegmentDone(flow));
  },

  _render(evt, onDone) {
    const srcNode = lookupDeviceNode(evt.src && evt.src.device);
    const netNode = lookupNetworkNode(evt.network);
    if (!srcNode || !netNode) { if (onDone) onDone(); return; }

    const layer = document.getElementById('packet-layer');
    if (!layer) { if (onDone) onDone(); return; }

    const color = this.COLORS[evt.type] || { fill: '#777', opacity: 1.0 };
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', 8);
    dot.setAttribute('fill', color.fill);
    dot.setAttribute('opacity', color.opacity);
    dot.setAttribute('stroke', 'rgba(0,0,0,0.35)');
    dot.setAttribute('stroke-width', '1');
    dot.style.pointerEvents = 'all';
    dot.dataset.evt = JSON.stringify(evt);
    layer.appendChild(dot);

    dot.addEventListener('mouseenter', () => showPacketTooltip(evt, dot));
    dot.addEventListener('mouseleave', hidePacketTooltip);

    const dstNode = lookupAddressNode(evt.dst && evt.dst.address) || lookupDeviceNode(evt.dst && evt.dst.device);
    const finish = () => {
      if (dot.parentNode) layer.removeChild(dot);
      if (onDone) onDone();
    };
    this._tween(dot, srcNode, netNode, this.DURATION_MS / 2, () => {
      if (!dstNode) { finish(); return; }
      this._tween(dot, netNode, dstNode, this.DURATION_MS / 2, finish);
    });
  },

  _chatterAllowed(evt) {
    const key = `${evt.src && evt.src.device}:${evt.network}`;
    const now = performance.now();
    const last = this._lastChatter.get(key) || 0;
    if (now - last < 200) return false;
    this._lastChatter.set(key, now);
    return true;
  },

  _tween(dot, fromNode, toNode, durationMs, done) {
    const fp = getNodeCenter(fromNode);
    const tp = getNodeCenter(toNode);
    if (!fp || !tp) { done(); return; }
    // Track elapsed manually so the animation freezes while Sim is paused —
    // lets users hover/inspect packets mid-flight.
    let elapsed = 0;
    let lastT = performance.now();
    const tick = () => {
      const now = performance.now();
      if (Sim.state !== 'paused') elapsed += (now - lastT);
      lastT = now;
      const t = Math.min(1, elapsed / durationMs);
      dot.setAttribute('cx', fp.x + (tp.x - fp.x) * t);
      dot.setAttribute('cy', fp.y + (tp.y - fp.y) * t);
      if (t < 1) requestAnimationFrame(tick);
      else done();
    };
    requestAnimationFrame(tick);
  },
};

/* ---------- Terminals ---------- */
const Terminals = {
  _active: new Map(),                   // name -> element

  open(deviceName) {
    if (Sim && Sim.state === 'idle') {
      toast('Start the simulation to use device terminals', 'info');
      return;
    }
    if (this._active.has(deviceName)) {
      const el = this._active.get(deviceName);
      el.style.display = 'flex';
      this._applySimState(Sim.state);
      el.querySelector('.term-in').focus();
      return;
    }
    const tmpl = `
      <div class="term-header">
        <div class="traffic">
          <span class="light close" title="Close"></span>
          <span class="light min" title=""></span>
          <span class="light max" title=""></span>
        </div>
        <div class="title">${escapeHtml(deviceName)}@netrouting</div>
        <div class="paused-chip" hidden>(paused)</div>
      </div>
      <pre class="term-out">netrouting v1.0 — ${escapeHtml(deviceName)}
type 'help' for commands

</pre>
      <div class="term-line">
        <span class="term-prompt">${escapeHtml(deviceName)}@netrouting:~$</span>
        <input class="term-in" autocomplete="off" spellcheck="false" />
        <span class="term-cursor"></span>
      </div>`;
    const w = document.createElement('div');
    w.className = 'term';
    w.innerHTML = tmpl;
    const pos = JSON.parse(localStorage.getItem('term.pos.' + deviceName) || 'null') || { x: 120 + this._active.size * 20, y: 120 + this._active.size * 20 };
    w.style.left = pos.x + 'px';
    w.style.top = pos.y + 'px';
    document.body.appendChild(w);
    this._active.set(deviceName, w);
    this._wire(w, deviceName);
    this._applySimState(Sim.state);
    w.querySelector('.term-in').focus();
  },

  _applySimState(simState) {
    const paused = simState === 'paused';
    for (const w of this._active.values()) {
      const input = w.querySelector('.term-in');
      const chip = w.querySelector('.paused-chip');
      const cursor = w.querySelector('.term-cursor');
      if (input) input.disabled = paused;
      if (chip) chip.hidden = !paused;
      if (cursor) cursor.style.display = paused ? 'none' : '';
    }
  },

  _wire(w, name) {
    const out = w.querySelector('.term-out');
    const inp = w.querySelector('.term-in');
    const close = w.querySelector('.light.close');
    const history = JSON.parse(sessionStorage.getItem('term.hist.' + name) || '[]');
    let histIdx = history.length;

    const closeTerm = () => {
      w.remove();
      this._active.delete(name);
    };
    close.addEventListener('click', closeTerm);

    // Click anywhere on the term window refocuses the input — recovers from accidental blur.
    w.addEventListener('mousedown', (e) => {
      if (e.target.closest('.light.close')) return;
      if (e.target === inp) return;
      if (!inp.disabled) setTimeout(() => inp.focus(), 0);
    });

    // Drag
    const hdr = w.querySelector('.term-header');
    let drag = null;
    hdr.addEventListener('mousedown', (e) => {
      drag = { x: e.clientX - w.offsetLeft, y: e.clientY - w.offsetTop };
    });
    window.addEventListener('mousemove', (e) => {
      if (!drag) return;
      w.style.left = (e.clientX - drag.x) + 'px';
      w.style.top = (e.clientY - drag.y) + 'px';
    });
    window.addEventListener('mouseup', () => {
      if (drag) localStorage.setItem('term.pos.' + name, JSON.stringify({ x: w.offsetLeft, y: w.offsetTop }));
      drag = null;
    });

    inp.addEventListener('keydown', async (e) => {
      if (e.ctrlKey && (e.key === 'd' || e.key === 'D')) {
        if (inp.value === '') {
          e.preventDefault();
          closeTerm();
          return;
        }
      }
      if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
        e.preventDefault();
        out.textContent = '';
        return;
      }
      if (e.key === 'Enter') {
        const cmd = inp.value;
        out.textContent += `${name}@netrouting:~$ ${cmd}\n`;
        inp.value = '';
        if (cmd.trim() === 'clear') {
          out.textContent = '';
        } else if (cmd.trim() !== '') {
          try {
            const r = await RuntimeClient.deviceCommand(name, cmd);
            const txt = r.output || '(no output)';
            out.textContent += txt + (txt.endsWith('\n') ? '' : '\n');
            if (cmd.trim() === 'help') {
              out.textContent += 'terminal: clear, Ctrl+L (clear), Ctrl+D (close)\n';
            }
          } catch (err) {
            out.textContent += `[error] ${err.message}\n`;
          }
        }
        out.scrollTop = out.scrollHeight;
        if (cmd.trim()) {
          history.push(cmd);
          histIdx = history.length;
          sessionStorage.setItem('term.hist.' + name, JSON.stringify(history.slice(-200)));
        }
      } else if (e.key === 'ArrowUp') {
        if (histIdx > 0) {
          histIdx--;
          inp.value = history[histIdx] || '';
        }
        e.preventDefault();
      } else if (e.key === 'ArrowDown') {
        if (histIdx < history.length - 1) {
          histIdx++;
          inp.value = history[histIdx] || '';
        } else {
          inp.value = '';
          histIdx = history.length;
        }
        e.preventDefault();
      }
    });
  },
};

function showPacketTooltip(evt, dot) {
  let tt = document.getElementById('packet-tooltip');
  if (!tt) {
    tt = document.createElement('div');
    tt.id = 'packet-tooltip';
    tt.className = 'packet-tt';
    document.body.appendChild(tt);
  }
  const hopSrc = (evt.src && evt.src.address) || '?';
  const hopDst = (evt.dst && evt.dst.address) || '?';
  const origSrc = evt.payload_src || hopSrc;
  const origDst = evt.payload_dst || hopDst;
  const sameAsHop = origSrc === hopSrc && origDst === hopDst;
  const headline = `${evt.type}: ${origSrc} → ${origDst}`;
  tt.innerHTML = sameAsHop
    ? escapeHtml(headline)
    : `${escapeHtml(headline)}<div class="hop">hop: ${escapeHtml(hopSrc)} → ${escapeHtml(hopDst)}</div>`;
  tt.style.display = 'block';
  const bbox = dot.getBoundingClientRect();
  tt.style.left = (bbox.right + 8) + 'px';
  tt.style.top = (bbox.top - 4) + 'px';
}

function hidePacketTooltip() {
  const tt = document.getElementById('packet-tooltip');
  if (tt) tt.style.display = 'none';
}

function lookupDeviceNode(name) {
  if (!name) return null;
  return document.querySelector(`#nodes-layer g[data-name="${cssEscape(name)}"][data-kind="host"], #nodes-layer g[data-name="${cssEscape(name)}"][data-kind="router"]`);
}

function lookupNetworkNode(name) {
  if (!name) return null;
  return document.querySelector(`#nodes-layer g[data-name="${cssEscape(name)}"][data-kind="network"]`);
}

function lookupAddressNode(address) {
  if (!address) return null;
  // Find host whose address matches
  for (const [hn, h] of Object.entries(state.hosts || {})) {
    if (h.address === address) return lookupDeviceNode(hn);
  }
  // Find router whose interface address matches
  for (const [rn, r] of Object.entries(state.routers || {})) {
    for (const iname of Object.keys(r.interfaces || {})) {
      if (r.interfaces[iname].address === address) return lookupDeviceNode(rn);
    }
  }
  return null;
}

function getNodeCenter(g) {
  if (!g) return null;
  // Each node's <g> has transform="translate(x, y)"; the centroid is at (0,0) in local space.
  const t = g.getAttribute('transform') || '';
  const m = t.match(/translate\(([-\d.]+)[,\s]\s*([-\d.]+)\)/);
  if (!m) return null;
  return { x: parseFloat(m[1]), y: parseFloat(m[2]) };
}

/* ---------- helpers ---------- */
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, kids = null) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') e.setAttribute('class', v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  if (kids) {
    if (Array.isArray(kids)) kids.forEach(c => c && e.appendChild(c));
    else if (typeof kids === 'string') e.textContent = kids;
    else e.appendChild(kids);
  }
  return e;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function uniqueName(prefix, dict) { let n = 1; while (dict[`${prefix}${n}`]) n++; return `${prefix}${n}`; }
function uniqueIface(ifaces) { let n = 0; while (ifaces[`eth${n}`]) n++; return `eth${n}`; }
function pad2(n) { return String(n).padStart(2, '0'); }
function setSave(s) { document.getElementById('save-state').lastChild.textContent = ' ' + s; }

}

/* ---------- toast ---------- */
function toast(msg, kind = '', label = null) {
  const wrap = document.getElementById('toasts');
  const elT = document.createElement('div');
  elT.className = `toast ${kind}`;
  const iconSvg = kind === 'ok'
    ? `<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg>`
    : kind === 'error'
      ? `<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l6 6M9 3l-6 6"/></svg>`
      : `<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="0.7" fill="currentColor"/></svg>`;
  elT.innerHTML = `
    <div class="icon">${iconSvg}</div>
    <div class="body">

/* ---------- layout (resizable panes) ---------- */
const LAYOUT_KEY = 'netrouting.layout';
const LAYOUT_DEF = { navW: 264, inspW: 332 };
const LAYOUT_LIMITS = {
  navW:  { min: 200, max: 520 },
  inspW: { min: 240, max: 600 },
};
function loadLayout() {
  try {
    const raw = localStorage.getItem(LAYOUT_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.navW === 'number')  document.documentElement.style.setProperty('--nav-w',  d.navW  + 'px');
    if (typeof d.inspW === 'number') document.documentElement.style.setProperty('--insp-w', d.inspW + 'px');
  } catch (_) {}
}
function persistLayout() {
  try {
    const cs = getComputedStyle(document.documentElement);
    const navW  = parseInt(cs.getPropertyValue('--nav-w'),  10);
    const inspW = parseInt(cs.getPropertyValue('--insp-w'), 10);
    localStorage.setItem(LAYOUT_KEY, JSON.stringify({ navW, inspW }));
  } catch (_) {}
}
function wireResizers() {
  const setup = (sel, varName, sign, key) => {
    const handle = document.querySelector(sel);
    if (!handle) return;

    handle.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      handle.setPointerCapture?.(e.pointerId);
      handle.classList.add('dragging');
      document.body.classList.add('col-resizing');
      const startX = e.clientX;
      const startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue(varName), 10);

      const onMove = (ev) => {
        const dx = ev.clientX - startX;
        let w = startW + dx * sign;
        const lim = LAYOUT_LIMITS[key];
        w = Math.max(lim.min, Math.min(lim.max, w));
        document.documentElement.style.setProperty(varName, w + 'px');
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.classList.remove('col-resizing');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        persistLayout();
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    handle.addEventListener('dblclick', () => {
      document.documentElement.style.setProperty(varName, LAYOUT_DEF[key] + 'px');
      persistLayout();
    });
  };

  setup('.splitter-nav',  '--nav-w',  +1, 'navW');   // drag right widens nav
  setup('.splitter-insp', '--insp-w', -1, 'inspW');  // drag right shrinks inspector
}

/* ---------- theme ---------- */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('[data-theme-btn]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-theme-btn') === theme);
  });
  try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
}
function initTheme() {
  let t = 'light';
  try { t = localStorage.getItem(THEME_KEY) || 'light'; } catch (_) {}
  if (t !== 'dark' && t !== 'light') t = 'light';
  applyTheme(t);
}

/* ---------- mark dirty ---------- */
function markDirty() {
  setSave('saving…');
  clearTimeout(markDirty._t);
  markDirty._t = setTimeout(() => persist(), 200);
}

/* ---------- layout: assign defaults to objects without positions ---------- */
function ensurePositions() {
  // simple grid fallback
  const FALLBACK_X = 700, FALLBACK_Y = 200, GAP = 220;
  let i = 0;
  for (const [n, nv] of Object.entries(state.networks)) {
    if (typeof nv.x !== 'number' || typeof nv.y !== 'number') {
      nv.x = FALLBACK_X; nv.y = FALLBACK_Y + i * GAP;
    }
    i++;
  }
  i = 0;
  for (const [hn, h] of Object.entries(state.hosts)) {
    if (typeof h.x !== 'number' || typeof h.y !== 'number') {
      const target = state.networks[h.network];
      if (target) { h.x = target.x - 230; h.y = target.y + (i % 2 === 0 ? -20 : 20); }
      else { h.x = 220; h.y = 180 + i * 110; }
    }
    i++;
  }
  i = 0;
  for (const [rn, r] of Object.entries(state.routers)) {
    if (typeof r.x !== 'number' || typeof r.y !== 'number') {
      const ifs = Object.values(r.interfaces || {});
      const targetNets = ifs.map(f => state.networks[f.network]).filter(Boolean);
      if (targetNets.length) {
        const avgY = targetNets.reduce((a, n) => a + n.y, 0) / targetNets.length;
        r.x = (targetNets[0].x || FALLBACK_X) + 230; r.y = avgY + (i - 1) * 30;
      } else {
        r.x = 900; r.y = 200 + i * 110;
      }
    }
    i++;
  }
}

/* ---------- canvas state ---------- */
const canvasEl    = () => document.getElementById('canvas');
const viewportEl  = () => document.getElementById('viewport');
const edgesLayer  = () => document.getElementById('edges-layer');
const nodesLayer  = () => document.getElementById('nodes-layer');
const overlayLay  = () => document.getElementById('overlay-layer');

function applyView() {
  const v = state.view;
  viewportEl().setAttribute('transform', `translate(${v.x} ${v.y}) scale(${v.k})`);
  document.getElementById('zoom-lvl').textContent = Math.round(v.k * 100) + '%';
}

function clientToWorld(cx, cy) {
  const svg = canvasEl();
  const rect = svg.getBoundingClientRect();
  const v = state.view;
  return { x: (cx - rect.left - v.x) / v.k, y: (cy - rect.top - v.y) / v.k };
}

function fitView() {
  const all = [
    ...Object.entries(state.networks).map(([k, v]) => ({ ...v, k: 'network' })),
    ...Object.entries(state.hosts).map(([k, v]) => ({ ...v, k: 'host' })),
    ...Object.entries(state.routers).map(([k, v]) => ({ ...v, k: 'router' })),
  ];
  if (all.length === 0) {
    state.view = { x: 0, y: 0, k: 1 };
    applyView();
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  all.forEach(o => {
    const { w, h } = NODE[o.k];
    minX = Math.min(minX, o.x - w/2);
    minY = Math.min(minY, o.y - h/2);
    maxX = Math.max(maxX, o.x + w/2);
    maxY = Math.max(maxY, o.y + h/2);
  });
  const pad = 80;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const svg = canvasEl();
  const rect = svg.getBoundingClientRect();
  const k = Math.min(rect.width / (maxX - minX), rect.height / (maxY - minY), 1.4);
  state.view = {
    k,
    x: (rect.width - (maxX - minX) * k) / 2 - minX * k,
    y: (rect.height - (maxY - minY) * k) / 2 - minY * k,
  };
  applyView();
}

/* ---------- canvas: render ---------- */
function renderCanvas() {
  ensurePositions();
  const empty =
    Object.keys(state.networks).length === 0 &&
    Object.keys(state.hosts).length === 0 &&
    Object.keys(state.routers).length === 0;
  document.getElementById('canv-empty').hidden = !empty;

  // clear layers
  edgesLayer().innerHTML = '';
  nodesLayer().innerHTML = '';
  overlayLay().innerHTML = '';

  // edges first (drawn underneath)
  for (const [hn, h] of Object.entries(state.hosts)) {
    if (!h.network || !state.networks[h.network]) continue;
    drawEdge(h, state.networks[h.network], 'host', { kind:'host', name: hn });
  }
  for (const [rn, r] of Object.entries(state.routers)) {
    for (const [ifn, iff] of Object.entries(r.interfaces || {})) {
      if (!iff.network || !state.networks[iff.network]) continue;
      drawEdge(r, state.networks[iff.network], 'router',
        { kind:'router', name: rn }, { ifname: ifn, cost: iff.cost });
    }
  }

  // nodes — networks first so they sit "behind" devices
  for (const [name, n] of Object.entries(state.networks)) drawNode('network', name, n);
  for (const [name, h] of Object.entries(state.hosts))    drawNode('host',    name, h);
  for (const [name, r] of Object.entries(state.routers))  drawNode('router',  name, r);

  applyView();
}

function drawEdge(a, b, kind, sel, info) {
  // a, b have x,y at center; we clip to each node's rect
  const aSize = NODE[sel.kind === 'host' ? 'host' : 'router'];
  const bSize = NODE.network;
  const [ax, ay] = clipToRect(a.x, a.y, aSize.w, aSize.h, b.x, b.y);
  const [bx, by] = clipToRect(b.x, b.y, bSize.w, bSize.h, a.x, a.y);
  const dx = bx - ax, dy = by - ay;
  // smooth bezier
  const c1x = ax + dx * 0.55, c1y = ay;
  const c2x = bx - dx * 0.55, c2y = by;
  const d = `M ${ax} ${ay} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${bx} ${by}`;

  const isSel = state.selection &&
    ((state.selection.kind === sel.kind && state.selection.name === sel.name) ||
     (state.selection.kind === 'network' && state.selection.name === Object.entries(state.networks).find(([n, v]) => v === b)?.[0]));
  const path = el('path', {
    class: `edge ${kind}${isSel ? ' selected' : ''}`,
    d,
  });
  edgesLayer().appendChild(path);

  if (info) {
    // midpoint for label placement
    const t = 0.5;
    const mx = bezPoint(ax, c1x, c2x, bx, t);
    const my = bezPoint(ay, c1y, c2y, by, t);
    if (info.cost != null && info.cost !== '') {
      edgesLayer().appendChild(el('text', {
        class: 'edge-cost',
        x: mx, y: my - 6,
        'text-anchor': 'middle',
      }, `c·${info.cost}`));
    }
    if (info.ifname) {
      // ifname placed near "a" side
      const tn = 0.18;
      const ix = bezPoint(ax, c1x, c2x, bx, tn);
      const iy = bezPoint(ay, c1y, c2y, by, tn);
      edgesLayer().appendChild(el('text', {
        class: 'edge-iface',
        x: ix, y: iy - 5,
        'text-anchor': 'middle',
      }, info.ifname));
    }
  }
}
function bezPoint(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
}
function clipToRect(cx, cy, w, h, tx, ty) {
  const dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) return [cx, cy];
  const tw = (w / 2) / Math.max(0.0001, Math.abs(dx));
  const th = (h / 2) / Math.max(0.0001, Math.abs(dy));
  const t = Math.min(tw, th);
  return [cx + dx * t, cy + dy * t];
}

function drawNode(kind, name, obj) {
  const isSel = state.selection && state.selection.kind === kind && state.selection.name === name;
  const { w, h } = NODE[kind];
  const pad = HIT_PAD[kind];

  // group is centered at obj.x, obj.y (the icon/cloud centroid)
  const g = el('g', {
    class: `node ${kind}${isSel ? ' selected' : ''}`,
    transform: `translate(${obj.x} ${obj.y})`,
    'data-kind': kind,
    'data-name': name,
  });

  // hit rect — invisible, covers the icon + label region
  g.appendChild(el('rect', {
    class: 'hit',
    x: -w / 2 - pad.x,
    y: -h / 2 - pad.top,
    width: w + pad.x * 2,
    height: h + pad.top + pad.bottom,
    rx: 10,
  }));

  if (kind === 'network') {
    // cloud silhouette, centered at (0,0)
    g.appendChild(el('path', {
      class: 'cloud',
      d: cloudPath(w, h),
      transform: `translate(${-w / 2} ${-h / 2})`,
    }));
    // LAN name centered in cloud (slightly above geometric center for visual balance)
    g.appendChild(el('text', {
      class: 'name',
      x: 0, y: -4,
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      style: 'font-size:15px;',
    }, name));
    // CIDR badge below the cloud
    g.appendChild(el('text', {
      class: `sub ${obj.cidr ? '' : 'empty'}`,
      x: 0, y: h / 2 + 18,
      'text-anchor': 'middle',
    }, obj.cidr || '— no cidr'));
  } else {
    // host / router: just the icon, then name, then sub
    const icoVB = kind === 'host' ? '0 0 28 30' : '0 0 32 30';
    const ico = el('svg', {
      class: 'icon',
      x: -w / 2, y: -h / 2,
      width: w, height: h,
      viewBox: icoVB,
      'pointer-events': 'none',
    });
    ico.innerHTML = `<use href="#ico-${kind}"/>`;
    g.appendChild(ico);

    // dashed selection ring around the icon
    g.appendChild(el('rect', {
      class: 'ring',
      x: -w / 2 - 6,
      y: -h / 2 - 6,
      width: w + 12,
      height: h + 12,
      rx: 8,
    }));

    // name below the icon
    g.appendChild(el('text', {
      class: 'name',
      x: 0, y: h / 2 + 16,
      'text-anchor': 'middle',
    }, name));

    // sub below the name
    let sub;
    if (kind === 'host') sub = obj.address || '— unset';
    else {
      const c = Object.keys(obj.interfaces || {}).length;
      sub = `${c} iface${c === 1 ? '' : 's'}`;
    }
    g.appendChild(el('text', {
      class: `sub ${kind === 'host' && !obj.address ? 'empty' : ''}`,
      x: 0, y: h / 2 + 30,
      'text-anchor': 'middle',
    }, sub));
  }

  attachNodeEvents(g, kind, name);
  nodesLayer().appendChild(g);
}

/* hand-tuned cloud silhouette — 4 lobes, flat-ish bottom; coords in 200x80 base, scaled to (w,h) */
function cloudPath(w, h) {
  const sx = w / 200, sy = h / 80;
  const seg = (cmd, ...nums) => cmd + ' ' + nums.map((n, i) =>
    ((i % 2 === 0 ? n * sx : n * sy)).toFixed(2)
  ).join(' ');
  return [
    seg('M', 40, 68),
    seg('C', 12, 68, 8, 40, 34, 36),
    seg('C', 28, 14, 64, 8, 76, 28),
    seg('C', 86, 8, 124, 8, 134, 28),
    seg('C', 154, 14, 190, 28, 180, 50),
    seg('C', 204, 50, 204, 72, 178, 70),
    seg('L', 40, 70),
    'Z',
  ].join(' ');
}

/* ---------- interaction ---------- */
let drag = null;          // active drag state
let pan  = null;          // active pan state
let rclickTimer = null;

function attachNodeEvents(g, kind, name) {
  g.addEventListener('pointerdown', (e) => {
    if (e.button === 2) return; // right-click handled separately
    e.stopPropagation();

    // Selection works in any sim state — users need to inspect nodes while running.
    state.selection = { kind, name };
    nodesLayer().querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
    g.classList.add('selected');
    renderInspector();
    renderNav();

    // Drag is gated: only when topology is editable (idle or paused).
    if (isTopologyLocked()) return;

    // capture on the node itself so the synthesized click event stays on the
    // node — capturing on the canvas redirects click to the SVG, which would
    // otherwise trigger the "click background to deselect" handler.
    g.setPointerCapture?.(e.pointerId);
    const obj = ({network: state.networks, host: state.hosts, router: state.routers})[kind][name];
    const start = clientToWorld(e.clientX, e.clientY);
    drag = {
      pointerId: e.pointerId,
      kind, name, obj,
      offX: start.x - obj.x,
      offY: start.y - obj.y,
      startClientX: e.clientX,
      startClientY: e.clientY,
      moved: false,
      hoverNet: null,
    };
    g.classList.add('dragging');
  });

  g.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    if (kind === 'host' || kind === 'router') {
      e.preventDefault();
      Terminals.open(name);
      return;
    }
    state.selection = { kind, name };
    renderAll();
    const insp = document.getElementById('inspector');
    insp.classList.remove('flash');
    void insp.offsetWidth;
    insp.classList.add('flash');
    setTimeout(() => insp.classList.remove('flash'), 600);
    const f = insp.querySelector('input, select');
    if (f) f.focus();
  });

  g.addEventListener('contextmenu', (e) => {
    e.preventDefault(); e.stopPropagation();
    state.selection = { kind, name };
    renderAll();
    openContextMenu(e.clientX, e.clientY, { kind, name });
  });
}

/* canvas-level drag/pan handlers (delegate via the svg) */
function wireCanvas() {
  const svg = canvasEl();

  // pointerdown on background → pan, dismiss any ctxmenu
  svg.addEventListener('pointerdown', (e) => {
    closeContextMenu();
    if (e.target.closest('.node')) return;
    if (e.button === 2) return; // right click handled by contextmenu listener
    pan = {
      pointerId: e.pointerId,
      sx: e.clientX, sy: e.clientY,
      ox: state.view.x, oy: state.view.y,
    };
    svg.classList.add('panning');
    svg.setPointerCapture?.(e.pointerId);
  });

  svg.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.node')) return;  // node menus handled at node level
    e.preventDefault();
    const w = clientToWorld(e.clientX, e.clientY);
    openContextMenu(e.clientX, e.clientY, null, w);
  });

  // pointermove — drag or pan
  document.addEventListener('pointermove', (e) => {
    if (drag) {
      // ignore tiny jitter so a click isn't mis-classified as a drag
      if (!drag.moved) {
        const dxc = e.clientX - drag.startClientX;
        const dyc = e.clientY - drag.startClientY;
        if (dxc * dxc + dyc * dyc < 16) return;  // 4px threshold
        drag.moved = true;
      }
      const w = clientToWorld(e.clientX, e.clientY);
      drag.obj.x = w.x - drag.offX;
      drag.obj.y = w.y - drag.offY;

      // for host/router: detect drop target (LAN under cursor)
      let hover = null;
      if (drag.kind === 'host' || drag.kind === 'router') {
        for (const [nn, nv] of Object.entries(state.networks)) {
          const { w: nw, h: nh } = NODE.network;
          if (Math.abs(w.x - nv.x) < nw/2 + 24 && Math.abs(w.y - nv.y) < nh/2 + 24) {
            hover = nn; break;
          }
        }
      }
      if (drag.hoverNet !== hover) {
        // re-render to flip drop-target class — cheap enough
        drag.hoverNet = hover;
        // toggle classes directly to avoid full re-render thrash
        nodesLayer().querySelectorAll('.node.network').forEach(node => {
          node.classList.toggle('drop-target', node.getAttribute('data-name') === hover);
        });
      }
      // partial: re-render edges connected to drag.obj
      reRenderEdges();
      // and update the dragged node's transform directly — the group is
      // centered at obj.x/obj.y (its inner contents are placed around 0,0),
      // so the transform is just translate(obj.x, obj.y), not offset by w/2.
      const nodeEl = nodesLayer().querySelector(`.node[data-kind="${drag.kind}"][data-name="${cssEscape(drag.name)}"]`);
      if (nodeEl) {
        nodeEl.setAttribute('transform', `translate(${drag.obj.x} ${drag.obj.y})`);
      }
      // preview link line for host/router → hovered LAN
      drawDragPreview();
    }
    if (pan) {
      state.view.x = pan.ox + (e.clientX - pan.sx);
      state.view.y = pan.oy + (e.clientY - pan.sy);
      applyView();
    }
  });

  document.addEventListener('pointerup', (e) => {
    if (drag) {
      const node = nodesLayer().querySelector(`.node[data-kind="${drag.kind}"][data-name="${cssEscape(drag.name)}"]`);
      node?.classList.remove('dragging');

      if (drag.moved) {
        const target = drag.hoverNet;
        nodesLayer().querySelectorAll('.node.network.drop-target').forEach(n => n.classList.remove('drop-target'));
        overlayLay().innerHTML = '';

        // commit attachment
        if (target) {
          if (drag.kind === 'host') {
            if (state.hosts[drag.name].network !== target) {
              state.hosts[drag.name].network = target;
              toast(`Pinned host ${drag.name} → ${target}`, 'ok');
            }
          } else if (drag.kind === 'router') {
            const r = state.routers[drag.name];
            const has = Object.values(r.interfaces || {}).some(iff => iff.network === target);
            if (!has) {
              const newIf = uniqueIface(r.interfaces);
              r.interfaces[newIf] = { network: target, address: '', cost: 10 };
              toast(`Added ${newIf} on ${drag.name} → ${target}`, 'ok');
            }
          }
        }

        markDirty();
        renderAll();
      }
      drag = null;
    }
    if (pan) {
      canvasEl().classList.remove('panning');
      pan = null;
      markDirty();
    }
  });

  // wheel zoom
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const w = clientToWorld(e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.10 : (1 / 1.10);
    const newK = Math.max(0.25, Math.min(2.5, state.view.k * factor));
    // keep cursor world position fixed
    const rect = svg.getBoundingClientRect();
    state.view.x = (e.clientX - rect.left) - w.x * newK;
    state.view.y = (e.clientY - rect.top)  - w.y * newK;
    state.view.k = newK;
    applyView();
  }, { passive: false });

  // dismiss menu on background click
  svg.addEventListener('click', (e) => {
    if (e.target.closest('.node')) return;
    state.selection = null;
    renderAll();
  });
}

function cssEscape(s) {
  return CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, '');
}

/* re-render only the edges (drag perf) */
function reRenderEdges() {
  edgesLayer().innerHTML = '';
  for (const [hn, h] of Object.entries(state.hosts)) {
    if (!h.network || !state.networks[h.network]) continue;
    drawEdge(h, state.networks[h.network], 'host', { kind:'host', name: hn });
  }
  for (const [rn, r] of Object.entries(state.routers)) {
    for (const [ifn, iff] of Object.entries(r.interfaces || {})) {
      if (!iff.network || !state.networks[iff.network]) continue;
      drawEdge(r, state.networks[iff.network], 'router',
        { kind:'router', name: rn }, { ifname: ifn, cost: iff.cost });
    }
  }
}

function drawDragPreview() {
  overlayLay().innerHTML = '';
  if (!drag || !drag.hoverNet) return;
  if (drag.kind !== 'host' && drag.kind !== 'router') return;
  const a = drag.obj;
  const b = state.networks[drag.hoverNet];
  if (!b) return;
  const aSize = NODE[drag.kind];
  const bSize = NODE.network;
  const [ax, ay] = clipToRect(a.x, a.y, aSize.w, aSize.h, b.x, b.y);
  const [bx, by] = clipToRect(b.x, b.y, bSize.w, bSize.h, a.x, a.y);
  const dx = bx - ax;
  const c1x = ax + dx * 0.55, c1y = ay;
  const c2x = bx - dx * 0.55, c2y = by;
  const d = `M ${ax} ${ay} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${bx} ${by}`;
  overlayLay().appendChild(el('path', { class: 'edge preview', d }));
}

/* ---------- context menu ---------- */
let _ctxEl = null;
function closeContextMenu() {
  if (_ctxEl) { _ctxEl.remove(); _ctxEl = null; }
}

function openContextMenu(clientX, clientY, target, world) {
  closeContextMenu();
  const m = document.createElement('div');
  m.className = 'ctx';
  let html = '';
  const locked = isTopologyLocked();
  const mut = (a) => `data-act="${a}" ${locked ? 'disabled aria-disabled="true"' : ''}`;

  if (!target) {
    // empty canvas
    html += `
      <div class="ctx-head">Create at this point</div>
      <button class="ctx-item" ${mut('new-net')}><svg class="ico"><use href="#ui-net"/></svg>New LAN<span class="meta">N</span></button>
      <button class="ctx-item" ${mut('new-host')}><svg class="ico"><use href="#ui-host"/></svg>New host<span class="meta">H</span></button>
      <button class="ctx-item" ${mut('new-router')}><svg class="ico"><use href="#ui-router"/></svg>New router<span class="meta">R</span></button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" data-act="fit">Fit to view</button>
      <button class="ctx-item" ${mut('sample')}>Load sample</button>
    `;
  } else {
    const obj = ({network: state.networks, host: state.hosts, router: state.routers})[target.kind][target.name];
    html += `<div class="ctx-head">${escapeHtml(target.kind)} · ${escapeHtml(target.name)}</div>`;
    html += `<button class="ctx-item" ${mut('edit')}><svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12h2l7-7-2-2-7 7v2zM9 3l2 2"/></svg>Edit<span class="meta">2×</span></button>`;
    if (target.kind === 'network') {
      html += `<button class="ctx-item" ${mut('add-host-here')}><svg class="ico"><use href="#ui-host"/></svg>Add host here</button>`;
      html += `<button class="ctx-item" ${mut('add-router-here')}><svg class="ico"><use href="#ui-router"/></svg>Add router here</button>`;
    }
    if (target.kind === 'host') {
      const opts = Object.keys(state.networks).filter(n => n !== obj.network);
      if (opts.length) {
        html += `<div class="ctx-sub${locked ? ' disabled' : ''}">
          <button class="ctx-item" data-act="" ${locked ? 'disabled aria-disabled="true"' : ''}>Move to LAN…</button>
          <div class="ctx-panel">
            ${opts.map(n => `<button class="ctx-item" ${mut('move-host')} data-net="${escapeHtml(n)}"><svg class="ico"><use href="#ui-net"/></svg>${escapeHtml(n)}</button>`).join('')}
          </div>
        </div>`;
      }
      if (obj.network) {
        html += `<button class="ctx-item" ${mut('detach-host')}><svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7h8M5 4l-2 3 2 3M9 4l2 3-2 3"/></svg>Detach from LAN</button>`;
      }
    }
    if (target.kind === 'router') {
      // submenu: connect to LAN
      const used = new Set(Object.values(obj.interfaces || {}).map(i => i.network));
      const unused = Object.keys(state.networks).filter(n => !used.has(n));
      if (unused.length) {
        html += `<div class="ctx-sub${locked ? ' disabled' : ''}">
          <button class="ctx-item" data-act="" ${locked ? 'disabled aria-disabled="true"' : ''}>Connect to LAN…</button>
          <div class="ctx-panel">
            ${unused.map(n => `<button class="ctx-item" ${mut('connect-router')} data-net="${escapeHtml(n)}"><svg class="ico"><use href="#ui-net"/></svg>${escapeHtml(n)}</button>`).join('')}
          </div>
        </div>`;
      }
    }
    html += `
      <div class="ctx-sep"></div>
      <button class="ctx-item" ${mut('duplicate')}><svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="4" y="4" width="8" height="8" rx="1"/></svg>Duplicate</button>
      <button class="ctx-item danger" ${mut('delete')}><svg class="ico" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4h8M5 4V2.5h4V4M4.5 4l.5 7h4l.5-7"/></svg>Delete<span class="meta">⌫</span></button>
    `;
  }

  m.innerHTML = html;
  document.body.appendChild(m);
  _ctxEl = m;

  // position (clamp to viewport)
  m.style.left = '0px';
  m.style.top = '0px';
  const r = m.getBoundingClientRect();
  let x = clientX, y = clientY;
  if (x + r.width  > window.innerWidth)  x = window.innerWidth  - r.width  - 6;
  if (y + r.height > window.innerHeight) y = window.innerHeight - r.height - 6;
  m.style.left = x + 'px';
  m.style.top  = y + 'px';

  // wire actions
  m.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');
    if (!act) return; // submenu opener
    const net = btn.getAttribute('data-net');
    handleCtxAction(act, target, world, net);
    closeContextMenu();
  });
}

function handleCtxAction(act, target, world, arg) {
  if (isTopologyLocked()) return;
  switch (act) {
    case 'new-net':    addNew('network', world); break;
    case 'new-host':   addNew('host', world); break;
    case 'new-router': addNew('router', world); break;
    case 'fit':        fitView(); break;
    case 'sample':     loadSample(); break;
    case 'edit':
      state.selection = { kind: target.kind, name: target.name };
      renderAll();
      const f = document.getElementById('inspector').querySelector('input, select');
      if (f) f.focus();
      break;
    case 'add-host-here': {
      const net = state.networks[target.name];
      const name = uniqueName('h', state.hosts);
      state.hosts[name] = { network: target.name, address: '', x: net.x - 280, y: net.y };
      state.selection = { kind:'host', name };
      markDirty(); renderAll();
      break;
    }
    case 'add-router-here': {
      const net = state.networks[target.name];
      const name = uniqueName('r', state.routers);
      state.routers[name] = {
        x: net.x + 280, y: net.y,
        interfaces: { eth0: { network: target.name, address: '', cost: 10 } },
      };
      state.selection = { kind:'router', name };
      markDirty(); renderAll();
      break;
    }
    case 'move-host': {
      state.hosts[target.name].network = arg;
      toast(`Moved ${target.name} → ${arg}`, 'ok');
      markDirty(); renderAll();
      break;
    }
    case 'detach-host': {
      state.hosts[target.name].network = '';
      toast(`Detached ${target.name}`, 'ok');
      markDirty(); renderAll();
      break;
    }
    case 'connect-router': {
      const r = state.routers[target.name];
      const newIf = uniqueIface(r.interfaces);
      r.interfaces[newIf] = { network: arg, address: '', cost: 10 };
      toast(`Added ${newIf} on ${target.name} → ${arg}`, 'ok');
      markDirty(); renderAll();
      break;
    }
    case 'duplicate':
      if (target.kind === 'network') duplicateNetwork(target.name);
      else if (target.kind === 'host') duplicateHost(target.name);
      else if (target.kind === 'router') duplicateRouter(target.name);
      break;
    case 'delete':
      state.selection = { kind: target.kind, name: target.name };
      deleteSelected();
      break;
  }
}

document.addEventListener('click', (e) => {
  if (_ctxEl && !e.target.closest('.ctx')) closeContextMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _ctxEl) closeContextMenu();
});

/* ---------- nav ---------- */
function renderNav() {
  const elN = document.getElementById('nav');
  const sections = [
    { kind: 'network', title: 'LANs',    items: state.networks, glyph: 'ui-net',
      meta: (k, v) => v.cidr || '—' },
    { kind: 'host',    title: 'Hosts',    items: state.hosts,    glyph: 'ui-host',
      meta: (k, v) => v.address || '—' },
    { kind: 'router',  title: 'Routers',  items: state.routers,  glyph: 'ui-router',
      meta: (k, v) => `${Object.keys(v.interfaces || {}).length} ifaces` },
  ];
  elN.innerHTML = sections.map(sec => {
    const keys = Object.keys(sec.items);
    return `
      <div class="nav-section">
        <div class="nav-shead">
          <div class="left">
            <span class="ttl">${escapeHtml(sec.title)}</span>
            <span class="count">${pad2(keys.length)}</span>
          </div>
          <button class="add" data-add="${sec.kind}" aria-label="Add ${sec.title}">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
          </button>
        </div>
        <div class="nav-list">
          ${keys.length === 0
            ? `<div class="nav-empty">No ${escapeHtml(sec.title.toLowerCase())} yet · press <kbd>+</kbd></div>`
            : keys.map(k => {
                const sel = state.selection && state.selection.kind === sec.kind && state.selection.name === k;
                return `
                  <div class="nav-row ${sel ? 'selected' : ''}" data-pick='${escapeHtml(JSON.stringify({kind: sec.kind, name: k}))}'>
                    <span class="glyph ${sec.kind}"><svg viewBox="0 0 14 14"><use href="#${sec.glyph}"/></svg></span>
                    <span class="name">${escapeHtml(k)}</span>
                    <span class="meta">${escapeHtml(sec.meta(k, sec.items[k]))}</span>
                  </div>
                `;
              }).join('')
          }
        </div>
      </div>
    `;
  }).join('');

  elN.querySelectorAll('[data-pick]').forEach(row => {
    row.addEventListener('click', () => {
      try {
        state.selection = JSON.parse(row.getAttribute('data-pick'));
        renderAll();
        centerOnSelection();
      } catch (_) {}
    });
  });
  elN.querySelectorAll('[data-add]').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); addNew(b.getAttribute('data-add')); });
  });
}

function centerOnSelection() {
  if (!state.selection) return;
  const { kind, name } = state.selection;
  const obj = ({network: state.networks, host: state.hosts, router: state.routers})[kind][name];
  if (!obj) return;
  const svg = canvasEl();
  const rect = svg.getBoundingClientRect();
  state.view.x = rect.width / 2 - obj.x * state.view.k;
  state.view.y = rect.height / 2 - obj.y * state.view.k;
  applyView();
}

/* ---------- inspector (mostly unchanged) ---------- */
function renderInspector() {
  const elI = document.getElementById('inspector');
  if (!state.selection) {
    elI.innerHTML = `
      <div class="insp-empty">
        <div class="icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 9h6v6H9z"/>
            <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
          </svg>
        </div>
        <div class="ttl">Nothing selected</div>
        <div class="sub">Click any node to select. Double-click to edit, drag onto a LAN to attach.</div>
      </div>
    `;
    return;
  }
  const { kind, name } = state.selection;
  if (kind === 'network') return renderNetworkInsp(name, elI);
  if (kind === 'host')    return renderHostInsp(name, elI);
  if (kind === 'router')  return renderRouterInsp(name, elI);
}

function renderNetworkInsp(name, elI) {

  elI.innerHTML = `
    <div class="insp-head">

      <div class="name">${escapeHtml(name)}</div>
    </div>

      <div class="field">
        <label>Identifier</label>
        <input id="f-name" value="${escapeHtml(name)}" spellcheck="false" />

        <label>CIDR</label>
        <input id="f-cidr" value="${escapeHtml(net.cidr || '')}" spellcheck="false" placeholder="192.168.0.0/24" />
        <div class="hint">Network address with prefix length.</div>
      </div>
    </div>
    <div class="insp-foot">
      <button class="dup" id="f-dup">Duplicate</button>
      <button class="del" id="f-del">Delete</button>
    </div>
  `;
  elI.querySelector('#f-name').addEventListener('change', e => renameNetwork(name, e.target.value.trim()));
  elI.querySelector('#f-cidr').addEventListener('input', e => {

    state.networks[name].cidr = e.target.value.trim();

  elI.querySelector('#f-del').addEventListener('click', deleteSelected);
  elI.querySelector('#f-dup').addEventListener('click', () => duplicateNetwork(name));
}

function renderHostInsp(name, elI) {
  const host = state.hosts[name];
  if (!host) { state.selection = null; return renderInspector(); }
  const opts = Object.keys(state.networks)
    .map(n => `<option value="${escapeHtml(n)}" ${host.network===n?'selected':''}>${escapeHtml(n)}</option>`).join('');
  elI.innerHTML = `
    <div class="insp-head">
      <div class="pre"><span class="pill host">host</span></div>
      <div class="name">${escapeHtml(name)}</div>
    </div>
    <div class="insp-body">
      <div class="field">
        <label>Hostname</label>
        <input id="f-name" value="${escapeHtml(name)}" spellcheck="false" />
      </div>
      <div class="field">
        <label>Network</label>
        <select id="f-net">${opts ? '<option value="">— unattached</option>' + opts : '<option value="">(no networks)</option>'}</select>
        <div class="hint">Pin a host to a LAN by dragging it on the canvas.</div>
      </div>
      <div class="field">
        <label>IP address</label>
        <input id="f-addr" value="${escapeHtml(host.address || '')}" spellcheck="false" placeholder="192.168.0.10" />
      </div>
      <div class="field">
        <label>Default gateway</label>
        <input id="f-gw" value="${escapeHtml(host.gateway || '')}" spellcheck="false" placeholder="(none)" />
        <div class="hint">Must be an IP within the host's network.</div>
      </div>
    </div>
    <div class="insp-routes" id="insp-routes" hidden></div>
    <div class="insp-foot">
      <button class="dup" id="f-dup">Duplicate</button>
      <button class="del" id="f-del">Delete</button>
    </div>
  `;
  elI.querySelector('#f-name').addEventListener('change', e => renameHost(name, e.target.value.trim()));
  elI.querySelector('#f-net').addEventListener('change', e => {
    if (isTopologyLocked()) return;
    state.hosts[name].network = e.target.value;
    markDirty(); renderCanvas(); renderNav();
  });
  elI.querySelector('#f-addr').addEventListener('input', e => {
    if (isTopologyLocked()) return;
    state.hosts[name].address = e.target.value.trim();
    markDirty(); renderCanvas(); renderNav();
  });
  elI.querySelector('#f-gw').addEventListener('change', async (e) => {
    const v = e.target.value.trim();
    // While the sim is running, push the new gateway live so routes update immediately.
    if (Sim.state === 'running' || Sim.state === 'paused') {
      if (!v) {
        toast('Clearing the gateway requires stopping the simulation', 'info', 'Gateway');
        e.target.value = state.hosts[name].gateway || '';
        return;
      }
      try {
        const r = await RuntimeClient.deviceCommand(name, `set_gateway ${v}`);
        if (!r.ok) {
          toast(r.output, 'error', 'Gateway');
          e.target.value = state.hosts[name].gateway || '';
          return;
        }
      } catch (err) {
        toast(err.message || String(err), 'error', 'Gateway');
        e.target.value = state.hosts[name].gateway || '';
        return;
      }
    }
    if (v) state.hosts[name].gateway = v;
    else delete state.hosts[name].gateway;
    markDirty();
  });
  elI.querySelector('#f-del').addEventListener('click', deleteSelected);
  elI.querySelector('#f-dup').addEventListener('click', () => duplicateHost(name));
  Inspector.refreshRoutes(name);
}

  const router = state.routers[name];
  if (!router) { state.selection = null; return renderInspector(); }
  const ifaces = Object.entries(router.interfaces || {});
  const optsFor = (sel) => {
    const opts = Object.keys(state.networks)
      .map(n => `<option value="${escapeHtml(n)}" ${sel===n?'selected':''}>${escapeHtml(n)}</option>`).join('');
    return opts ? '<option value="">— none</option>' + opts : '<option value="">(no networks)</option>';
  };
  elI.innerHTML = `
    <div class="insp-head">
      <div class="pre"><span class="pill router">router</span> <span style="color:var(--text-3);">· ${ifaces.length} ${ifaces.length===1?'interface':'interfaces'}</span></div>
      <div class="name">${escapeHtml(name)}</div>
    </div>
    <div class="insp-body">
      <div class="field">
        <label>Identifier</label>
        <input id="f-name" value="${escapeHtml(name)}" spellcheck="false" />
      </div>
      <div class="field">
        <label>Interfaces</label>
        <div class="iflist">
          ${ifaces.map(([ifn, ifc]) => `
            <details class="iface" data-iface="${escapeHtml(ifn)}">
              <summary class="ihead">
                <span class="ttl">
                  <span class="pill">${escapeHtml(ifn)}</span>
                  <span class="iface-summary">${escapeHtml(ifc.network || '—')} · ${escapeHtml(ifc.address || 'no ip')} · cost=${escapeHtml(String(ifc.cost ?? '—'))}</span>
