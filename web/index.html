<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>netrouting</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600&display=swap"
  rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<!-- =========== ICON DEFS =========== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <!-- Network / LAN: a small switch box with port lights and uplink -->
  <symbol id="ico-net" viewBox="0 0 32 26">
    <rect x="2.5" y="6.5" width="27" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="2.5" y1="13" x2="29.5" y2="13" stroke="currentColor" stroke-width="1" opacity="0.35"/>
    <!-- 5 port lights inside -->
    <rect x="6"  y="14.6" width="3" height="2.6" rx="0.4" fill="currentColor" opacity="0.7"/>
    <rect x="11" y="14.6" width="3" height="2.6" rx="0.4" fill="currentColor" opacity="0.55"/>
    <rect x="16" y="14.6" width="3" height="2.6" rx="0.4" fill="currentColor" opacity="0.7"/>
    <rect x="21" y="14.6" width="3" height="2.6" rx="0.4" fill="currentColor" opacity="0.4"/>
    <rect x="26" y="14.6" width="3" height="2.6" rx="0.4" fill="currentColor" opacity="0.7"/>
    <!-- uplink -->
    <line x1="16" y1="2" x2="16" y2="6.5" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="16" cy="2" r="1.2" fill="currentColor"/>
    <!-- bottom taps -->
    <line x1="9"  y1="19.5" x2="9"  y2="23" stroke="currentColor" stroke-width="1"/>
    <line x1="16" y1="19.5" x2="16" y2="23" stroke="currentColor" stroke-width="1"/>
    <line x1="23" y1="19.5" x2="23" y2="23" stroke="currentColor" stroke-width="1"/>
    <circle cx="9"  cy="23" r="1" fill="currentColor"/>
    <circle cx="16" cy="23" r="1" fill="currentColor"/>
    <circle cx="23" cy="23" r="1" fill="currentColor"/>
  </symbol>

  <!-- Host: workstation / monitor with stand -->
  <symbol id="ico-host" viewBox="0 0 28 30">
    <!-- monitor frame -->
    <rect x="2.5" y="3.5" width="23" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- inner screen -->
    <rect x="5" y="6" width="18" height="11" rx="0.6" fill="currentColor" opacity="0.10"/>
    <!-- horizontal "lines" of text on screen -->
    <line x1="6.5" y1="9"  x2="14"   y2="9"  stroke="currentColor" stroke-width="1" opacity="0.55"/>
    <line x1="6.5" y1="11.5" x2="19" y2="11.5" stroke="currentColor" stroke-width="1" opacity="0.40"/>
    <line x1="6.5" y1="14"  x2="11"  y2="14"  stroke="currentColor" stroke-width="1" opacity="0.55"/>
    <!-- stand -->
    <line x1="14" y1="19.5" x2="14" y2="24" stroke="currentColor" stroke-width="1.2"/>
    <line x1="8"  y1="26.8" x2="20" y2="26.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11" y1="24"   x2="17" y2="24"   stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- Router: stylized 3D cube with two antennae and ethernet ports -->
  <symbol id="ico-router" viewBox="0 0 32 30">
    <!-- antennae -->
    <line x1="9" y1="2.5" x2="9" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="23" y1="2.5" x2="23" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="9"  cy="2.5" r="1.2" fill="currentColor"/>
    <circle cx="23" cy="2.5" r="1.2" fill="currentColor"/>
    <!-- main body — slight isometric: top diamond + sides -->
    <path d="M16 8 L29 13 L16 18 L3 13 Z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M3 13 L3 21 L16 26 L16 18 Z" fill="currentColor" fill-opacity="0.28" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M29 13 L29 21 L16 26 L16 18 Z" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- ports -->
    <circle cx="6.5"  cy="16.7" r="0.9" fill="currentColor"/>
    <circle cx="9.5"  cy="17.8" r="0.9" fill="currentColor"/>
    <circle cx="12.5" cy="18.9" r="0.9" fill="currentColor"/>
  </symbol>

  <!-- ui glyphs -->
  <symbol id="ui-net" viewBox="0 0 14 14">
    <rect x="1.5" y="3.5" width="11" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <line x1="4" y1="8.5" x2="4" y2="11" stroke="currentColor" stroke-width="1.3"/>
    <line x1="7" y1="8.5" x2="7" y2="11" stroke="currentColor" stroke-width="1.3"/>
    <line x1="10" y1="8.5" x2="10" y2="11" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <symbol id="ui-host" viewBox="0 0 14 14">
    <rect x="2" y="2.5" width="10" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <line x1="5" y1="11.5" x2="9" y2="11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="7" y1="9.5" x2="7" y2="11.5" stroke="currentColor" stroke-width="1"/>
  </symbol>
  <symbol id="ui-router" viewBox="0 0 14 14">
    <line x1="4" y1="2" x2="4" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="10" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="2" y="5.5" width="10" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <circle cx="4.5" cy="8.5" r="0.7" fill="currentColor"/>
    <circle cx="7"   cy="8.5" r="0.7" fill="currentColor"/>
    <circle cx="9.5" cy="8.5" r="0.7" fill="currentColor"/>
  </symbol>
  <symbol id="ui-play" viewBox="0 0 16 16"><polygon points="3,2 13,8 3,14" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ui-pause" viewBox="0 0 16 16"><rect x="3" y="2" width="3" height="12" fill="currentColor"/><rect x="10" y="2" width="3" height="12" fill="currentColor"/></symbol>
  <symbol id="ui-reset" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><polyline points="3,2 3,5 6,5"/></symbol>
</defs>
</svg>

<div class="app" id="app">

  <!-- ========= HEADER ========= -->
  <header class="header">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <!-- "routed path": packet bezier-curves through two hops and arrives at the destination arrowhead -->
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 3 4 C 6 4, 5 8, 8 8 S 10 12, 12 12"/>
          <circle cx="3" cy="4" r="2" fill="currentColor" stroke="none"/>
          <circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/>
          <path d="M 10.5 9 L 14.5 12 L 10.5 15 Z" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="name">netrouting</div>
      <span class="ver">v0.1</span>
    </div>

    <div class="head-mid">
      <div class="crumb">
        <span>document</span>
        <span class="sep">/</span>
        <input class="proj" id="proj-name" value="test_as" spellcheck="false" />
      </div>
      <div class="save" id="save-state"><span class="dot"></span> autosaved</div>
    </div>

    <div class="head-actions">
      <div class="theme-toggle" role="tablist" aria-label="theme">
        <button data-theme-btn="light" class="active" title="Light">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="3"/>
            <path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5L3.4 3.4"/>
          </svg>
        </button>
        <button data-theme-btn="dark" title="Dark">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M13.2 9.7A5.5 5.5 0 0 1 6.3 2.8a5.5 5.5 0 1 0 6.9 6.9z"/>
          </svg>
        </button>
      </div>
      <button class="btn outline" id="btn-sample" title="Load sample topology">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2.5" y="3.5" width="11" height="2" rx="0.5"/>
          <rect x="2.5" y="7" width="8" height="2" rx="0.5"/>
          <rect x="2.5" y="10.5" width="10" height="2" rx="0.5"/>
        </svg>
        Sample
      </button>
      <button class="btn outline" id="btn-import" title="Import YAML">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 11V2M4 7l4 4 4-4M2 14h12"/>
        </svg>
        Import
      </button>
      <button class="btn primary" id="btn-export" title="Export YAML">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 2v9M4 6l4-4 4 4M2 14h12"/>
        </svg>
        Export
      </button>
    </div>
  </header>

  <!-- ========= NAV ========= -->
  <aside class="nav" id="nav"></aside>

  <!-- splitter: nav | canvas -->
  <div class="splitter splitter-nav" title="Drag to resize · double-click to reset"></div>

  <!-- ========= CANVAS ========= -->
  <section class="canv-wrap">
    <!-- toolbar -->
    <div class="canv-toolbar">
      <button class="tb-btn network" id="tb-add-net" title="Add LAN (N)">
        <svg class="ico"><use href="#ui-net"/></svg> LAN
      </button>
      <button class="tb-btn host" id="tb-add-host" title="Add host (H)">
        <svg class="ico"><use href="#ui-host"/></svg> Host
      </button>
      <button class="tb-btn router" id="tb-add-router" title="Add router (R)">
        <svg class="ico"><use href="#ui-router"/></svg> Router
      </button>
      <span class="div"></span>
      <button class="tb-btn" id="tb-fit" title="Reset view">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/>
        </svg>
        Fit
      </button>
      <span class="div"></span>
      <button class="tb-btn primary" id="tb-play" title="Start simulation (Space)">
        <svg class="ico"><use href="#ui-play"/></svg> <span class="lbl">Start</span>
      </button>
      <button class="tb-btn" id="tb-pause" title="Pause simulation (P)" hidden>
        <svg class="ico"><use href="#ui-pause"/></svg> <span class="lbl">Pause</span>
      </button>
      <button class="tb-btn" id="tb-reset" title="Revert topology to source" disabled>
        <svg class="ico"><use href="#ui-reset"/></svg> Reset
      </button>
      <span class="div"></span>
      <label class="tb-refresh" title="Routing keepalive interval (1–300s)">
        <span class="lbl">Keepalive</span>
        <input id="tb-refresh" type="number" min="1" max="300" step="1" value="10" disabled />
        <span class="unit">s</span>
      </label>
      <label class="tb-refresh" title="Packet animation duration per hop (200–5000ms)">
        <span class="lbl">Packets</span>
        <input id="tb-speed" type="number" min="200" max="5000" step="100" value="1800" />
        <span class="unit">ms</span>
      </label>
      <button class="tb-btn" id="tb-chatter" title="Show/hide routing-protocol packets in the canvas">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="4" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="8" r="1.5" fill="currentColor"/>
        </svg>
        <span class="lbl">Chatter</span>
      </button>
      <button class="tb-btn" id="tb-toggle-costs" title="Show/hide link costs">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M9 2L2 9l5 5 7-7V2z"/>
          <circle cx="10.5" cy="5.5" r="1" fill="currentColor"/>
        </svg>
        <span class="lbl">Costs</span>
      </button>
      <button class="tb-btn" id="tb-toggle-ifaces" title="Show/hide interface names and counts">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="2" y="6" width="12" height="4" rx="1"/>
          <path d="M5 6V4M8 6V4M11 6V4"/>
        </svg>
        <span class="lbl">Ifaces</span>
      </button>
    </div>

    <!-- zoom -->
    <div class="canv-zoom">
      <button id="zoom-out" title="Zoom out">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 8h10"/></svg>
      </button>
      <div class="lvl" id="zoom-lvl">100%</div>
      <button id="zoom-in" title="Zoom in">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>

    <!-- hint strip -->
    <div class="canv-hint">
      <span class="item">drag <kbd>shift</kbd>+drag pan</span>
      <span class="item"><kbd>2×click</kbd> edit</span>
      <span class="item"><kbd>right-click</kbd> menu</span>
    </div>

    <!-- the canvas -->
    <svg class="canvas" id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport">
        <g id="edges-layer"></g>
        <g id="packet-layer"></g>
        <g id="nodes-layer"></g>
        <g id="overlay-layer"></g>
      </g>
    </svg>

    <!-- empty state overlay -->
    <div class="canv-empty" id="canv-empty" hidden>
      <div class="inner">
        <div class="icon-row">
          <svg viewBox="0 0 32 26" style="color:var(--net)"><use href="#ico-net"/></svg>
          <svg viewBox="0 0 28 30" style="color:var(--host)"><use href="#ico-host"/></svg>
          <svg viewBox="0 0 32 30" style="color:var(--rtr)"><use href="#ico-router"/></svg>
        </div>
        <div class="ttl">No topology yet</div>
        <div class="sub">Add a LAN, then drop hosts and routers onto it. Or load the sample to explore.</div>
        <div class="actions">
          <button class="btn primary" id="empty-add-net">+ Add LAN</button>
          <button class="btn outline" id="empty-sample">Load sample</button>
        </div>
      </div>
    </div>
  </section>

  <!-- splitter: canvas | inspector -->
  <div class="splitter splitter-insp" title="Drag to resize · double-click to reset"></div>

  <!-- ========= INSPECTOR ========= -->
  <aside class="insp" id="inspector"></aside>

</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="app.js"></script>
</body>
</html>
