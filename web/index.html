                <button class="del" data-del-iface="${escapeHtml(ifn)}" title="Remove">
                  <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l6 6M9 3l-6 6"/></svg>
                </button>
              </summary>
              <div class="grid full">
                <div class="pair">
                  <label>Interface name</label>
                  <input data-iface-name="${escapeHtml(ifn)}" value="${escapeHtml(ifn)}" spellcheck="false" />
                </div>
              </div>
              <div class="grid">
                <div class="pair">
                  <label>Network</label>
                  <select data-iface-net="${escapeHtml(ifn)}">${optsFor(ifc.network)}</select>
                </div>
                <div class="pair">
                  <label>Cost</label>
                  <input type="number" min="0" data-iface-cost="${escapeHtml(ifn)}" value="${ifc.cost ?? ''}" />
                </div>
              </div>
              <div class="grid full">
                <div class="pair">
                  <label>IP address</label>
                  <input data-iface-addr="${escapeHtml(ifn)}" value="${escapeHtml(ifc.address || '')}" spellcheck="false" placeholder="10.0.0.1" />
                </div>
              </div>
            </details>
          `).join('')}
        </div>
        <button class="add-if" id="add-if" style="margin-top:8px;">+ Add interface</button>
      </div>
    </div>
    <div class="insp-routes" id="insp-routes" hidden></div>
    <div class="insp-foot">
      <button class="dup" id="f-dup">Duplicate</button>
      <button class="del" id="f-del">Delete</button>
    </div>
  `;
  elI.querySelector('#f-name').addEventListener('change', e => renameRouter(name, e.target.value.trim()));
  elI.querySelector('#add-if').addEventListener('click', () => {
    if (isTopologyLocked()) return;
    const newIf = uniqueIface(state.routers[name].interfaces);
    state.routers[name].interfaces[newIf] = {
      network: Object.keys(state.networks)[0] || '',
      address: '', cost: 0,
    };
    markDirty(); renderInspector(); renderCanvas(); renderNav();
  });
  elI.querySelectorAll('[data-del-iface]').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (isTopologyLocked()) return;
      delete state.routers[name].interfaces[b.getAttribute('data-del-iface')];
      markDirty(); renderInspector(); renderCanvas(); renderNav();
    });
  });
  elI.querySelectorAll('[data-iface-name]').forEach(inp => {
    inp.addEventListener('change', () => {
      if (isTopologyLocked()) return;
      const oldIf = inp.getAttribute('data-iface-name');
      const newIf = inp.value.trim();
      if (!newIf || newIf === oldIf) return;
      if (state.routers[name].interfaces[newIf]) {
        toast(`Interface "${newIf}" already exists on ${name}`, 'error', 'Rename');
        inp.value = oldIf; return;
      }
      const cur = state.routers[name].interfaces[oldIf];
      const rebuilt = {};
      for (const [k, v] of Object.entries(state.routers[name].interfaces)) {
        rebuilt[k === oldIf ? newIf : k] = (k === oldIf ? cur : v);
      }
      state.routers[name].interfaces = rebuilt;
      markDirty(); renderInspector(); renderCanvas(); renderNav();
    });
  });
  elI.querySelectorAll('[data-iface-net]').forEach(s => {
    s.addEventListener('change', () => {
      if (isTopologyLocked()) return;
      state.routers[name].interfaces[s.getAttribute('data-iface-net')].network = s.value;
      markDirty(); renderCanvas(); renderNav();
    });
  });
  elI.querySelectorAll('[data-iface-addr]').forEach(i => {
    i.addEventListener('input', () => {
      if (isTopologyLocked()) return;
      state.routers[name].interfaces[i.getAttribute('data-iface-addr')].address = i.value.trim();
      markDirty(); renderCanvas();
    });
  });
  elI.querySelectorAll('[data-iface-cost]').forEach(i => {
    i.addEventListener('input', () => {
      const v = parseInt(i.value, 10);
      const ifn = i.getAttribute('data-iface-cost');
      state.routers[name].interfaces[ifn].cost = isNaN(v) ? 0 : v;
      if (!isNaN(v) && v > 0) {
        recordPatchOp({ op: 'update_cost', router: name, iface: ifn, cost: v });
      }
      markDirty(); renderCanvas();
    });
  });
  elI.querySelector('#f-del').addEventListener('click', deleteSelected);
  elI.querySelector('#f-dup').addEventListener('click', () => duplicateRouter(name));
  Inspector.refreshRoutes(name);
}

/* ---------- crud ---------- */
function renameKey(dict, oldK, newK) {
  const cur = dict[oldK];
  const out = {};
  for (const [k, v] of Object.entries(dict)) out[k === oldK ? newK : k] = (k === oldK ? cur : v);
  return out;
}
function renameNetwork(oldName, newName) {
  if (isTopologyLocked()) return;
  if (!newName || newName === oldName) return;
  if (state.networks[newName]) { toast(`LAN "${newName}" already exists`, 'error', 'Rename'); renderInspector(); return; }
  state.networks = renameKey(state.networks, oldName, newName);
  Object.values(state.hosts).forEach(h => { if (h.network === oldName) h.network = newName; });
  Object.values(state.routers).forEach(r => Object.values(r.interfaces || {}).forEach(i => { if (i.network === oldName) i.network = newName; }));
  state.selection = { kind: 'network', name: newName };
  markDirty(); renderAll();
}
function renameHost(oldName, newName) {
  if (isTopologyLocked()) return;
  if (!newName || newName === oldName) return;
  if (state.hosts[newName]) { toast(`Host "${newName}" already exists`, 'error', 'Rename'); renderInspector(); return; }
  state.hosts = renameKey(state.hosts, oldName, newName);
  state.selection = { kind: 'host', name: newName };
  markDirty(); renderAll();
}
function renameRouter(oldName, newName) {
  if (isTopologyLocked()) return;
  if (!newName || newName === oldName) return;
  if (state.routers[newName]) { toast(`Router "${newName}" already exists`, 'error', 'Rename'); renderInspector(); return; }
  state.routers = renameKey(state.routers, oldName, newName);
  state.selection = { kind: 'router', name: newName };
  markDirty(); renderAll();
}
function duplicateNetwork(name) {
  if (isTopologyLocked() || (Sim && Sim.state === 'paused')) return;
  const newName = uniqueName(name + '_', state.networks);
  const src = state.networks[name];
  state.networks[newName] = { ...src, x: src.x + 30, y: src.y + 30 };
  state.selection = { kind: 'network', name: newName };
  markDirty(); renderAll();
}
function duplicateHost(name) {
  if (isTopologyLocked() || (Sim && Sim.state === 'paused')) return;
  const newName = uniqueName(name + '_', state.hosts);
  const src = state.hosts[name];
  state.hosts[newName] = { ...src, x: src.x + 30, y: src.y + 30 };
  state.selection = { kind: 'host', name: newName };
  markDirty(); renderAll();
}
function duplicateRouter(name) {
  if (isTopologyLocked() || (Sim && Sim.state === 'paused')) return;
  const newName = uniqueName(name + '_', state.routers);
  const src = state.routers[name];
  state.routers[newName] = JSON.parse(JSON.stringify(src));
  state.routers[newName].x = src.x + 30; state.routers[newName].y = src.y + 30;
  state.selection = { kind: 'router', name: newName };
  markDirty(); renderAll();
}
function deleteSelected() {
  if (isTopologyLocked()) return;
  if (!state.selection) return;
  const { kind, name } = state.selection;
  if (kind === 'network') {
    const usedBy = [];
    Object.entries(state.hosts).forEach(([hn, h]) => { if (h.network === name) usedBy.push(`host ${hn}`); });
    Object.entries(state.routers).forEach(([rn, r]) => {
      Object.entries(r.interfaces || {}).forEach(([ifn, iff]) => { if (iff.network === name) usedBy.push(`${rn}/${ifn}`); });
    });
    if (usedBy.length && !confirm(`LAN "${name}" is used by:\n  ${usedBy.join('\n  ')}\n\nDelete anyway? Their network field will be cleared.`)) return;
    Object.values(state.hosts).forEach(h => { if (h.network === name) h.network = ''; });
    Object.values(state.routers).forEach(r => Object.values(r.interfaces || {}).forEach(i => { if (i.network === name) i.network = ''; }));
    delete state.networks[name];
    recordPatchOp({ op: 'remove_network', name });
  } else if (kind === 'host') {
    delete state.hosts[name];
    recordPatchOp({ op: 'remove_host', name });
  } else if (kind === 'router') {
    delete state.routers[name];
    recordPatchOp({ op: 'remove_router', name });
  }
  state.selection = null;
  markDirty(); renderAll();
  toast(`${kind === 'network' ? 'LAN' : kind} "${name}" deleted`, 'ok');
}
function addNew(kind, world) {
  if (isTopologyLocked()) return;
  const def = world || worldCenter();
  if (kind === 'network') {
    const name = uniqueName('lan', state.networks);
    state.networks[name] = { cidr: '', x: def.x, y: def.y };
    state.selection = { kind, name };
    recordPatchOp({ op: 'add_network', name, address: '' });
  } else if (kind === 'host') {
    const name = uniqueName('h', state.hosts);
    state.hosts[name] = { network: '', address: '', x: def.x, y: def.y };
    state.selection = { kind, name };
    recordPatchOp({ op: 'add_host', name, network: '', address: '' });
    if (Object.keys(state.networks).length > 0) {
      toast(`Created ${name} — drag onto a LAN to attach`, '', 'orphan host');
    }
  } else if (kind === 'router') {
    const name = uniqueName('r', state.routers);
    state.routers[name] = { x: def.x, y: def.y, interfaces: {} };
    state.selection = { kind, name };
    recordPatchOp({ op: 'add_router', name, interfaces: [] });
    if (Object.keys(state.networks).length > 0) {
      toast(`Created ${name} — drag onto LANs to add interfaces`, '', 'orphan router');
    }
  }
  markDirty(); renderAll();
}
function worldCenter() {
  const svg = canvasEl();
  const rect = svg.getBoundingClientRect();
  return clientToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
}

/* ---------- yaml ---------- */
function exportYaml() {
  const out = { as: {
    name: state.asName || 'topology',
    networks: Object.fromEntries(Object.entries(state.networks).map(([k, v]) => [k, v.cidr || ''])),
    hosts: Object.fromEntries(Object.entries(state.hosts).map(([k, v]) => {
      const h = { network: v.network || '', address: v.address || '' };
      if (v.gateway) h.gateway = v.gateway;
      return [k, h];
    })),
    routers: Object.fromEntries(Object.entries(state.routers).map(([k, v]) => [k, {
      interfaces: Object.fromEntries(Object.entries(v.interfaces || {}).map(([ifn, iff]) => [ifn, {
        network: iff.network || '',
        address: iff.address || '',
        cost: typeof iff.cost === 'number' ? iff.cost : (parseInt(iff.cost, 10) || 0),
      }])),
    }])),
  } };
  return jsyaml.dump(out, { quotingType: '"', forceQuotes: true, lineWidth: -1, indent: 2 });
}
function importYaml(text) {
  let parsed;
  try { parsed = jsyaml.load(text); } catch (e) {
    toast(e.message || 'Failed to parse YAML', 'error', 'Parse error'); return false;
  }
  if (!parsed || !parsed.as) { toast('YAML root must be "as:"', 'error', 'Parse error'); return false; }
  const node = parsed.as;
  state.asName = node.name || 'unnamed_as';
  state.networks = {}; state.hosts = {}; state.routers = {};
  if (node.networks && typeof node.networks === 'object') {
    for (const [n, cidr] of Object.entries(node.networks)) state.networks[n] = { cidr: typeof cidr === 'string' ? cidr : String(cidr || '') };
  }
  if (node.hosts && typeof node.hosts === 'object') {
    for (const [n, v] of Object.entries(node.hosts)) {
      const h = { network: v?.network || '', address: v?.address || '' };
      if (v?.gateway) h.gateway = v.gateway;
      state.hosts[n] = h;
    }
  }
  if (node.routers && typeof node.routers === 'object') {
    for (const [n, v] of Object.entries(node.routers)) {
      const ifaces = {};
      if (v && v.interfaces && typeof v.interfaces === 'object') {
        for (const [ifn, iff] of Object.entries(v.interfaces)) {
          ifaces[ifn] = {
            network: iff?.network || '', address: iff?.address || '',
            cost: typeof iff?.cost === 'number' ? iff.cost : parseInt(iff?.cost, 10) || 0,
          };
        }
      }
      state.routers[n] = { interfaces: ifaces };
    }
  }
  ensurePositions();
  state.selection = null;
  document.getElementById('proj-name').value = state.asName;
  fitView();
  persist(); renderAll();
  toast('Topology imported', 'ok');
  return true;
}

/* ---------- modal ---------- */
function openModal({ title, text, primary, onPrimary, readonly = false }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="ttl">${escapeHtml(title)}</div>
        <button class="x" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <textarea spellcheck="false" ${readonly ? 'readonly' : ''}>${escapeHtml(text || '')}</textarea>
      </div>
      <div class="modal-foot">
        <button class="btn outline cancel">Cancel</button>
        <button class="btn primary go">${escapeHtml(primary)}</button>
      </div>
    </div>
  `;
  const close = () => wrap.remove();
  wrap.querySelector('.x').addEventListener('click', close);
  wrap.querySelector('.cancel').addEventListener('click', close);
  wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  wrap.querySelector('.go').addEventListener('click', () => {
    const v = wrap.querySelector('textarea').value;
    if (onPrimary(v) !== false) close();
  });
  document.body.appendChild(wrap);
  if (!readonly) wrap.querySelector('textarea').focus();
}

/* ---------- render coordinator ---------- */
function renderAll() {
  renderNav();
  renderCanvas();
  renderInspector();
}

/* ---------- wire ---------- */
function wire() {
  document.querySelectorAll('[data-theme-btn]').forEach(b => {
    b.addEventListener('click', () => applyTheme(b.getAttribute('data-theme-btn')));
  });
  document.getElementById('btn-sample').addEventListener('click', loadSample);
  document.getElementById('btn-import').addEventListener('click', () => {
    openModal({
      title: 'Import YAML', text: '', primary: 'Parse & load',
      onPrimary: importYaml,
    });
  });
  document.getElementById('btn-export').addEventListener('click', () => {
    openModal({
      title: 'Export YAML', text: exportYaml(),
      primary: 'Copy to clipboard', readonly: true,
      onPrimary: (v) => {
        navigator.clipboard?.writeText(v).then(() => toast('YAML copied to clipboard', 'ok'));
        return false;
      },
    });
  });
  document.getElementById('proj-name').addEventListener('change', e => {
    state.asName = e.target.value.trim() || 'topology';
    markDirty();
  });

  document.getElementById('tb-add-net').addEventListener('click',     () => addNew('network'));
  document.getElementById('tb-add-host').addEventListener('click',    () => addNew('host'));
  document.getElementById('tb-add-router').addEventListener('click',  () => addNew('router'));
  document.getElementById('tb-fit').addEventListener('click', fitView);

  document.getElementById('zoom-in').addEventListener('click', () => {
    const c = worldCenter();
    const k = Math.min(2.5, state.view.k * 1.15);
    const rect = canvasEl().getBoundingClientRect();
    state.view.x = rect.width / 2 - c.x * k;
    state.view.y = rect.height / 2 - c.y * k;
    state.view.k = k; applyView();
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    const c = worldCenter();
    const k = Math.max(0.25, state.view.k / 1.15);
    const rect = canvasEl().getBoundingClientRect();
    state.view.x = rect.width / 2 - c.x * k;
    state.view.y = rect.height / 2 - c.y * k;
    state.view.k = k; applyView();
  });

  document.getElementById('empty-add-net').addEventListener('click', () => addNew('network'));
  document.getElementById('empty-sample').addEventListener('click', loadSample);

  document.addEventListener('keydown', (e) => {
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'Escape') { state.selection = null; closeContextMenu(); renderAll(); }
    if (e.key === 'Delete') { if (state.selection) { e.preventDefault(); deleteSelected(); } }
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); addNew('network'); }
    if (k === 'h') { e.preventDefault(); addNew('host'); }
    if (k === 'r') { e.preventDefault(); addNew('router'); }
    if (k === 'f') { e.preventDefault(); fitView(); }
  });

  wireCanvas();

  // close ctx on resize
  window.addEventListener('resize', closeContextMenu);
}

/* ---------- init ---------- */
function init() {
  initTheme();
  loadLayout();
  if (!restore() ||
    (Object.keys(state.networks).length === 0 &&
     Object.keys(state.hosts).length === 0 &&
     Object.keys(state.routers).length === 0)) {
    state.asName = SAMPLE.asName;
    state.networks = JSON.parse(JSON.stringify(SAMPLE.networks));
    state.hosts = JSON.parse(JSON.stringify(SAMPLE.hosts));
    state.routers = JSON.parse(JSON.stringify(SAMPLE.routers));
  }
  document.getElementById('proj-name').value = state.asName;
  setSave('autosaved');
  ensurePositions();
  wire();
  wireResizers();
  renderAll();
  // initial fit (after layout)
  requestAnimationFrame(() => {
    if (!state.view || (state.view.k === 1 && state.view.x === 0 && state.view.y === 0)) fitView();
    else applyView();
  });
}
init();
</script>
</body>
