internet:
  name: loom
  autonomous_systems:
    main:
      asn: 65000
      networks:
        lan1: 100.100.100.0/24
        lan2: 100.100.200.0/22
      routers:
        r1:
          interfaces:
            eth0:
              network: lan1
              address: 100.100.100.1
              cost: 10
        r2:
          interfaces:
            eth0:
              network: lan2
              address: 100.100.200.1
              cost: 5
            eth1:
              network: lan1
              address: 100.100.100.2
              cost: 5
      hosts:
        h1:
          network: lan1
          address: 100.100.100.10
          gateway: 100.100.100.2
